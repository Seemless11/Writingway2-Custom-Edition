    <!-- Initial Loading Screen -->
    <div id="loadingScreen"
        style="position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg, #1C1917 0%, #292524 100%);display:flex;align-items:center;justify-content:center;z-index:99999;transition:opacity 0.5s ease-out;">
        <div style="text-align:center;max-width:500px;padding:40px;">
            <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:24px;"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg>
            <h1 style="margin:0 0 16px 0;color:var(--color-accent);font-size:32px;font-weight:700;font-family:var(--font-heading);">Writingway</h1>
            <p id="loadingStatus" style="color:rgba(255,255,255,0.8);font-size:16px;margin:16px 0;min-height:24px;">
                Starting up...</p>

            <!-- Loading bar -->
            <div
                style="width:100%;height:4px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden;margin:24px 0;">
                <div id="loadingBar"
                    style="height:100%;background:linear-gradient(90deg, var(--color-accent), #F59E0B);width:0%;transition:width 0.3s ease-out;">
                </div>
            </div>

            <p style="color:rgba(255,255,255,0.5);font-size:13px;line-height:1.6;margin:16px 0 0 0;">
                <span id="loadingTip">Loading your workspace...</span>
            </p>
        </div>
    </div>
