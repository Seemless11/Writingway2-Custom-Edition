                                                          <div style="display:flex;gap:8px;margin-bottom:12px;">
                                                              <button class="btn btn-primary" @click="showNewProjectModal = true" style="flex:1;display:flex;align-items:center;gap:6px;justify-content:center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg> New Project</button>
                                                               <button class="btn btn-secondary" @click="showW1ImportModal = true" title="Import from Writingway 1" style="display:flex;align-items:center;gap:6px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg> Import</button>
                                                               <button class="btn btn-secondary" @click="showNovelcrafterImportModal = true" title="Import from Novelcrafter" style="display:flex;align-items:center;gap:6px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17"/></svg> Import NC</button>
                                                         </div>
                                                      <div class="project-list">
                                                      <template x-for="project in projects" :key="project.id">
                                                              <div class="project-picker-card" @click="openProject(project.id)"
                                                                  style="display:flex;align-items:center;gap:16px;padding:16px 20px;margin-bottom:8px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:all 0.2s;"
                                                                  @mouseenter="$el.style.borderColor='rgba(74,158,255,0.5)';$el.style.background='rgba(217,119,6,0.08)'"
                                                                  @mouseleave="$el.style.borderColor='var(--border)';$el.style.background='var(--bg-secondary)'">
                                                                   <div style="font-size:32px;flex-shrink:0;display:flex;align-items:center;justify-content:center;width:40px;height:40px;"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17"/></svg></div>
                                                                  <div style="flex:1;min-width:0;text-align:left;">
                                                                      <div style="font-weight:600;font-size:16px;color:var(--text-primary);" x-text="project.name"></div>
                                                                      <div style="font-size:13px;color:var(--text-secondary);margin-top:2px;" x-text="'Last modified: ' + new Date(project.modified).toLocaleDateString()"></div>
                                                                  </div>
                                                                    <button @click.stop="
                                                                            renameProjectTargetId = project.id;
                                                                            renameProjectName = project.name;
                                                                            renameProjectPov = project.pov || '3rd person limited';
                                                                            renameProjectTense = project.tense || 'past';
                                                                            renameProjectLanguage = project.language || 'English';
                                                                             renameProjectPovCharacter = project.povCharacter || '';
                                                                             renameProjectGenres = [...(project.genres || [])];
                                                                            showRenameProjectModal = true" title="Edit project"
                                                                           style="background:none;border:none;font-size:16px;cursor:pointer;color:var(--text-secondary);padding:4px 6px;border-radius:6px;flex-shrink:0;"
                                                                           @mouseenter="$el.style.color='var(--accent)'"
                                                                            @mouseleave="$el.style.color='var(--text-secondary)'"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg></button>
                                                                    <button @click.stop="deleteProject(project.id)" title="Delete project"
                                                                            style="background:none;border:none;font-size:18px;cursor:pointer;color:var(--text-secondary);padding:4px 8px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;"
                                                                            @mouseenter="$el.style.color='var(--danger,#ef4444)'"
                                                                            @mouseleave="$el.style.color='var(--text-secondary)'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg></button>
                                                                    <div style="font-size:18px;color:var(--text-secondary);display:flex;align-items:center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></div>
                                                              </div>
                                                           </template>
                                                      </div>
                                                     </div>
                                                 </template>
                                            </div>
                                        </div>
                                    </template>
                                    <!-- Loading project -->
                                    <template x-if="currentProject && projectLoading">
                                        <div class="welcome-screen">
                                            <div class="welcome-content">
                                                <h2>Loading Project</h2>
                                                <div class="loading-bar" style="margin:20px auto;max-width:300px;">
                                                    <div class="loading-bar-fill" style="width:60%;"></div>
                                                </div>
                                                <p style="color:var(--text-secondary);">Loading scenes and content...</p>
                                            </div>
                                        </div>
                                    </template>
                                    <!-- Ready to write when project loaded but no scene selected -->
                                    <template x-if="currentProject && !projectLoading">
                                        <div class="welcome-screen">
                                            <div class="welcome-content">
                                                <h2>Ready to Write</h2>
                                                <p>Select a scene from the sidebar or create a new one to get started.</p>
                                            </div>
                                        </div>
                                    </template>
                                </template>
                            </div>
                        </div>

                        <!-- Splitter -->
                        <div x-show="showEmbeddedWorkshop" class="workshop-splitter" @mousedown="isDragging = true">
                        </div>

                        <!-- Embedded Workshop Panel -->
                        <div x-show="showEmbeddedWorkshop"
                            class="embedded-workshop-panel" :style="`width: ${100 - workshopSplitterPosition}%`">

                            <!-- Workshop Header -->
                            <div class="embedded-workshop-header">
                                <div style="display:flex;align-items:center;gap:6px;flex:1;min-width:0;flex-wrap:wrap;">
                                    <span style="font-size:14px;font-weight:600;white-space:nowrap;">Workshop</span>
                                    <select x-model="currentWorkshopSessionIndex" class="workshop-select"
                                        style="flex:1;min-width:60px;font-size:12px;">
                                        <template x-for="(session, idx) in workshopSessions" :key="session.id">
                                            <option :value="idx" x-text="session.name"></option>
                                        </template>
                                    </select>
                                    <select x-model="aiModel" @change="saveGenerationParams()" class="workshop-select"
                                        style="font-size:12px;min-width:90px;"
                                        title="AI Model for this chat"
                                        x-show="aiMode === 'api' || availableLocalModels.length > 0">
                                        <template x-for="model in (aiMode === 'api' ? (providerModels[aiProvider] || []) : [])" :key="model.id">
                                            <option :value="model.id" x-text="model.name + (model.recommended ? ' ⭐' : '')"></option>
                                        </template>
                                        <template x-for="modelName in (aiMode === 'local' ? availableLocalModels : [])" :key="modelName">
                                            <option :value="modelName" x-text="modelName"></option>
                                        </template>
                                        <option x-show="aiModel && ((aiMode === 'api' && !(providerModels[aiProvider] || []).find(m => m.id === aiModel)) || (aiMode === 'local' && !availableLocalModels.includes(aiModel)))"
                                            :value="aiModel" x-text="aiModel"></option>
                                    </select>
                                    <span x-show="aiMode === 'local' && availableLocalModels.length === 0"
                                        style="padding:3px 8px;background:rgba(76,175,80,0.1);border:1px solid rgba(76,175,80,0.3);border-radius:4px;font-size:11px;white-space:nowrap;">
                                        ✓ Local
                                    </span>
                                    <select x-model="selectedWorkshopPromptId" @change="saveSelectedWorkshopPrompt()" class="workshop-select"
                                        style="font-size:12px;min-width:80px;">
                                        <option value="">Default Prompt</option>
                                        <template x-for="p in prompts.filter(p => p.category === 'workshop')" :key="p.id">
                                            <option :value="p.id" x-text="p.title"></option>
                                        </template>
                                    </select>
                                    <select x-model="workshopFidelityMode" class="workshop-select"
                                        style="font-size:12px;min-width:64px;"
                                        title="Controls how much conversation history to include in AI requests">
                                        <option value="high">Fidelity: High</option>
                                        <option value="balanced">Fidelity: Balanced</option>
                                        <option value="compressed">Fidelity: Compressed</option>
                                    </select>
                                    <input type="number" x-model.number="maxTokens" min="1" max="20000" step="50"
                                        style="width:60px;font-size:11px;padding:3px 5px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:4px;color:var(--text-primary);text-align:center;"
                                        title="Target length in words">
                                </div>
                                <button class="btn btn-secondary btn-sm" @click="createWorkshopSession"
                                    title="New Chat">+</button>
                            </div>

                            <!-- Workshop Messages -->
                            <div class="embedded-workshop-messages">
                                <template
                                    x-if="workshopSessions[currentWorkshopSessionIndex] && workshopSessions[currentWorkshopSessionIndex].messages.length === 0">
                                    <div
                                        style="text-align:center;color:var(--text-secondary);font-size:13px;padding:20px;">
                                        Start a conversation with the AI to brainstorm ideas...
                                    </div>
                                </template>
                                <template x-if="workshopSessions[currentWorkshopSessionIndex]">
                                    <template
                                        x-for="(msg, idx) in workshopSessions[currentWorkshopSessionIndex].messages"
                                        :key="idx">
                                        <div class="workshop-message" :class="`workshop-message-${msg.role}` + (msg.isError ? ' workshop-message-error' : '')">
                                            <div x-show="workshopEditingIdx !== idx" style="display:flex;align-items:flex-start;gap:4px;">
                                                <div class="workshop-message-content" style="flex:1;min-width:0;"
                                                    x-html="markdownToHtml(msg.content || '')"></div>
                                                <div style="display:flex;gap:2px;flex-shrink:0;opacity:0;transition:opacity 0.15s;"
                                                    x-show="msg.content && workshopEditingIdx !== idx"
                                                    @mouseover="$el.style.opacity='1'" @mouseout="$el.style.opacity='0'"
                                                    @mouseenter="$el.style.opacity='1'" @mouseleave="$el.style.opacity='0'">
                                                    <template x-if="msg.role === 'assistant' && !msg.isError">
                                                        <button class="btn-icon-sm" @click="Workshop.editMessage($data, currentWorkshopSessionIndex, idx)" title="Edit" style="font-size:12px;padding:1px 4px;">
                                                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
                                                        </button>
                                                    </template>
                                                    <template x-if="msg.role === 'assistant' && !msg.isError">
                                                        <button class="btn-icon-sm" @click="Workshop.retryMessage($data, currentWorkshopSessionIndex, idx)" title="Retry" style="font-size:12px;padding:1px 4px;">
                                                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>
                                                        </button>
                                                    </template>
                                                    <template x-if="msg.role === 'user'">
                                                        <button class="btn-icon-sm" @click="Workshop.retryMessage($data, currentWorkshopSessionIndex, idx)" title="Edit" style="font-size:12px;padding:1px 4px;">
                                                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
                                                        </button>
                                                    </template>
                                                    <button class="btn-icon-sm" @click="Workshop.deleteMessage($data, currentWorkshopSessionIndex, idx)" title="Delete" style="font-size:12px;padding:1px 4px;">
                                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                                                    </button>
                                                </div>
                                            </div>
                                            <template x-if="workshopEditingIdx === idx">
                                                <div style="padding:4px 0;">
                                                    <textarea x-model="workshopEditingBuffer"
                                                        style="width:100%;min-height:60px;padding:6px 8px;background:var(--bg-primary);border:1px solid var(--border);border-radius:4px;color:var(--text-primary);font-size:12px;resize:vertical;box-sizing:border-box;font-family:inherit;"></textarea>
                                                    <div style="display:flex;gap:4px;margin-top:4px;">
                                                        <button class="btn btn-primary" style="font-size:10px;padding:3px 10px;" @click="Workshop.saveEdit($data, currentWorkshopSessionIndex)">Save</button>
                                                        <button class="btn btn-secondary" style="font-size:10px;padding:3px 10px;" @click="Workshop.cancelEdit($data)">Cancel</button>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </template>
                            </div>

                            <!-- Workshop Input -->
                            <div class="embedded-workshop-input-area">
                                <div style="position:relative;">
                                    <textarea class="embedded-workshop-textarea workshop-textarea" x-model="workshopInput"
                                        @input="window.workshopChat.onWorkshopInput($data, $event)"
                                        @keydown="window.workshopChat.handleWorkshopKeydown($data, $event); if ($event.key === 'Enter' && !$event.shiftKey) { $event.preventDefault(); window.workshopChat.sendMessage($data, workshopInput); }"
                                        placeholder="Type your message... Use @name for compendium entries, #scene for scenes."
                                        :disabled="workshopIsGenerating"></textarea>
                                    <!-- Compendium Quick Search Dropdown -->
                                    <div x-show="showWorkshopQuickSearch" x-cloak class="quick-search-dropdown"
                                        style="position:absolute;bottom:100%;left:0;right:0;max-height:200px;overflow-y:auto;background:var(--bg-primary);border:1px solid var(--border-primary);border-radius:4px;margin-bottom:4px;z-index:9999;">
                                        <template x-for="(item, idx) in workshopQuickSearchMatches" :key="item.id">
                                            <div class="quick-search-item"
                                                @click="window.workshopChat.selectWorkshopQuickMatch($data, item)"
                                                :class="{ 'active': idx === workshopQuickSearchSelectedIndex }"
                                                style="padding:8px;cursor:pointer;font-size:13px;">
                                                <div style="font-weight:600;" x-text="item.title"></div>
                                                <div style="font-size:11px;color:var(--text-secondary);" x-text="item.category"></div>
                                            </div>
                                        </template>
                                    </div>
                                    <!-- Scene Search Dropdown -->
                                    <div x-show="showWorkshopSceneSearch" x-cloak class="scene-search-dropdown"
                                        style="position:absolute;bottom:100%;left:0;right:0;max-height:200px;overflow-y:auto;background:var(--bg-primary);border:1px solid var(--border-primary);border-radius:4px;margin-bottom:4px;z-index:9999;">
                                        <template x-for="(scene, idx) in workshopSceneSearchMatches" :key="scene.id">
                                            <div class="scene-search-item"
                                                @click="window.workshopChat.selectWorkshopSceneMatch($data, scene)"
                                                :class="{ 'active': idx === workshopSceneSearchSelectedIndex }"
                                                style="padding:8px;cursor:pointer;font-size:13px;">
                                                <div style="font-weight:600;" x-text="scene.title"></div>
                                                <div style="font-size:11px;color:var(--text-secondary);">
                                                    <template x-if="scene.summary">
                                                        <span x-text="scene.summary.substring(0, 60) + '...'"></span>
                                                    </template>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                                <div style="display:flex;gap:8px;align-items:center;margin-top:8px;">
                                    <button class="btn btn-secondary btn-sm"
                                        @click="useWorkshopContextPanel = true; showContextPanel = true"
                                        :style="useWorkshopContextPanel ? 'background: rgba(76,175,80,0.2); border-color: rgba(76,175,80,0.5);' : ''"
                                        title="Open Context Panel (used in this chat)">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17"/></svg>
                                    </button>
                                    <button class="btn btn-secondary btn-sm"
                                        x-show="useWorkshopContextPanel"
                                        @click="useWorkshopContextPanel = false"
                                        title="Stop using Context Panel for this chat"
                                        style="padding:4px 8px;">
                                        ✕
                                    </button>
                                    <button class="btn btn-primary btn-sm"
                                        @click="window.workshopChat.sendMessage($data, workshopInput)"
                                        :disabled="false" style="flex:1;">
                                        <span x-show="!workshopIsGenerating">Send</span>
                                        <span x-show="workshopIsGenerating">Stop</span>
                                    </button>
                                </div>
                            </div>
                        </div>
