    <!-- ========== World Creator Modal ========== -->
    <template x-if="showWorldCreator">
        <div class="modal-overlay" @click.self="closeWorldCreator()" style="z-index:9500;">
            <div style="width:min(1200px,96%);height:min(800px,90vh);background:var(--bg-secondary);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;">
                <div style="display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0;">
                    <div style="display:flex;align-items:center;gap:12px;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                        <h3 style="margin:0;font-size:18px;">World Creator</h3>
                    </div>
                    <button class="btn btn-secondary" @click="closeWorldCreator()">Close</button>
                </div>
                <div x-show="worldCreatorDraftAlert" x-cloak style="padding:10px 20px;background:rgba(217,119,6,0.12);border-bottom:1px solid rgba(217,119,6,0.3);display:flex;align-items:center;gap:12px;flex-shrink:0;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg> <span style="font-size:14px;">Unsaved draft found from <span x-text="worldCreatorDraftAlert?.savedAt ? new Date(worldCreatorDraftAlert.savedAt).toLocaleString() : ''"></span></span>
                    <button class="btn btn-primary" style="font-size:12px;padding:4px 14px;" @click="restoreWorldCreatorDraft(worldCreatorDraftAlert)">Restore</button>
                    <button class="btn btn-secondary" style="font-size:12px;padding:4px 14px;" @click="discardWorldCreatorDraft()">Discard</button>
                </div>
                <div style="flex:1;display:flex;overflow:hidden;">
                    <div style="width:45%;overflow:auto;padding:16px 20px;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:12px;">
                        <input type="text" x-model="worldCreatorName" @input.debounce.500ms="saveWorldCreatorDraft()" placeholder="World name"
                            style="width:100%;padding:10px 14px;background:var(--bg-primary);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);font-size:15px;font-weight:600;">

                        <textarea x-model="worldCreatorNotes" @input.debounce.500ms="saveWorldCreatorDraft()" placeholder="World notes, ideas, or initial concepts..."
                            style="width:100%;padding:10px 14px;background:var(--bg-primary);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);font-size:13px;min-height:72px;resize:vertical;"></textarea>

                        <input type="file" id="worldCreatorImageInput" accept="image/png,image/jpeg,image/webp,image/gif" @change="onWorldCreatorImageSelected" style="display:none;">

                        <div x-show="!worldCreatorImageData" style="flex-shrink:0;">
                            <button class="btn btn-secondary" @click="triggerWorldCreatorImageUpload" style="font-size:12px;padding:6px 12px;">
                                📷 Add Reference Image
                            </button>
                        </div>

                        <div x-show="worldCreatorImageData" style="flex-shrink:0;display:flex;align-items:start;gap:8px;padding:8px;background:var(--bg-primary);border:1px solid var(--border);border-radius:8px;">
                            <img :src="worldCreatorImageData" style="width:60px;height:60px;object-fit:cover;border-radius:4px;flex-shrink:0;">
                            <div style="flex:1;min-width:0;">
                                <div style="font-size:12px;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" x-text="worldCreatorImageFileName"></div>
                                <div style="display:flex;gap:6px;margin-top:4px;">
                                    <button class="btn btn-primary" style="font-size:11px;padding:4px 8px;" @click="describeWorldCreatorImage" :disabled="worldCreatorImageDescrLoading">
                                        <span x-show="!worldCreatorImageDescrLoading">🖼️ Describe</span>
                                        <span x-show="worldCreatorImageDescrLoading">...</span>
                                    </button>
                                    <button class="btn btn-secondary" style="font-size:11px;padding:4px 8px;" @click="removeWorldCreatorImage">✕</button>
                                </div>
                            </div>
                        </div>

                        <div x-show="worldCreatorImageDescription" style="flex-shrink:0;border:1px solid var(--border);border-radius:8px;">
                            <label style="font-size:12px;font-weight:600;padding:6px 10px 0;display:block;color:var(--text-primary);">Image Reference</label>
                            <textarea x-model="worldCreatorImageDescription" style="width:100%;padding:8px 10px;background:transparent;border:none;font-size:12px;resize:vertical;min-height:60px;font-family:inherit;color:var(--text-primary);box-sizing:border-box;"></textarea>
                        </div>

                        <div x-show="worldCreatorImageError" x-cloak style="flex-shrink:0;font-size:12px;color:#e74c3c;padding:4px 0;" x-text="worldCreatorImageError"></div>

                        <div style="display:flex;gap:4px;align-items:center;flex-wrap:wrap;">
                            <template x-for="genre in window.WorldCreator.GENRES" :key="genre.id">
                                <span @click="toggleWorldCreatorGenre(genre.id)"
                                    style="padding:4px 10px;border-radius:999px;font-size:12px;border:1px solid;line-height:1.4;display:inline-flex;align-items:center;gap:4px;cursor:pointer;user-select:none;"
                                    :style="worldCreatorGenres.includes(genre.id)
                                        ? 'background:var(--accent);color:white;border-color:var(--accent);font-weight:600;'
                                        : 'background:var(--bg-primary);color:var(--text-secondary);border-color:var(--border);opacity:0.7;'"
                                    :title="'Show ' + genre.label + ' traits'">
                                    <span x-text="genre.icon"></span>
                                    <span x-text="genre.label"></span>
                                </span>
                            </template>
                            <button class="btn btn-secondary" @click="randomizeWorldCreator()" title="Randomize all traits" style="font-size:12px;padding:6px 12px;margin-left:auto;">🎲</button>
                            <button class="btn btn-secondary" @click="clearWorldCreatorTraits()" title="Clear all traits" style="font-size:12px;padding:6px 12px;">✕</button>
                        </div>

                        <template x-for="cat in (worldCreatorTraitVersion, getFilteredWorldCreatorCategories())" :key="cat.id">
                            <div>
                                <div @click="toggleWorldCreatorCategory(cat.id)"
                                    style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--bg-primary);border:1px solid var(--border);border-radius:8px;cursor:pointer;user-select:none;">
                                    <span style="font-weight:700;font-size:14px;color:var(--text-primary);" x-text="cat.label"></span>
                                    <span style="display:flex;align-items:center;gap:8px;">
                                        <span style="font-size:11px;color:var(--text-secondary);font-weight:600;background:rgba(217,119,6,0.1);padding:2px 10px;border-radius:999px;"
                                            x-text="'(' + ((worldCreatorSelectedTraits[cat.id] || []).length) + ')'"></span>
                                        <span style="font-size:10px;color:var(--text-secondary);" x-text="openWorldCreatorCategories.includes(cat.id) ? '▾' : '▸'"></span>
                                    </span>
                                </div>
                                <div x-show="openWorldCreatorCategories.includes(cat.id) && cat.groups" x-cloak style="margin-top:8px;padding-left:6px;">
                                    <template x-for="group in cat.groups" :key="group.label">
                                        <div style="margin-bottom:10px;">
                                            <div style="font-size:11px;font-weight:700;color:var(--text-secondary);margin-bottom:6px;padding-left:8px;border-left:3px solid var(--accent);text-transform:uppercase;letter-spacing:0.05em;" x-text="group.label"></div>
                                            <div style="display:flex;flex-wrap:wrap;gap:6px;">
                                                <template x-for="trait in group.traits" :key="trait.id">
                                                    <span @click="toggleWorldCreatorTrait(cat.id, trait.id)"
                                                        :title="trait.hint || ''"
                                                        class="cc-trait-pill"
                                                        style="padding:5px 14px;border-radius:999px;font-size:13px;border:1px solid;line-height:1.4;display:inline-flex;align-items:center;gap:4px;"
                                                        :style="(worldCreatorSelectedTraits[cat.id] || []).includes(trait.id)
                                                            ? 'background:var(--accent);color:white;border-color:var(--accent);font-weight:600;'
                                                            : trait.id.startsWith('custom_')
                                                                ? 'background:var(--bg-primary);color:var(--text-primary);border-color:rgba(217,119,6,0.3);border-style:dashed;opacity:0.85;'
                                                                : 'background:var(--bg-primary);color:var(--text-primary);border-color:var(--border);opacity:0.85;'">
                                                        <span x-show="(worldCreatorSelectedTraits[cat.id] || []).includes(trait.id)">✓</span>
                                                        <span x-text="trait.label"></span>
                                                        <span x-show="trait.id.startsWith('custom_')"
                                                            @click.stop="removeWorldCreatorCustomTrait(cat.id, group.label, trait.id)"
                                                            style="margin-left:2px;font-size:14px;line-height:1;cursor:pointer;opacity:0.5;display:inline-block;"
                                                            @mouseenter="$el.style.opacity='1'"
                                                            @mouseleave="$el.style.opacity='0.5'">×</span>
                                                    </span>
                                                </template>
                                                <span @click="openWorldCreatorAddTraitForm(cat.id, group.label)"
                                                    x-show="!worldCreatorAddTraitForm || worldCreatorAddTraitForm.catId !== cat.id || worldCreatorAddTraitForm.groupLabel !== group.label"
                                                    style="padding:4px 12px;border-radius:999px;font-size:12px;border:1px dashed var(--border);line-height:1.4;display:inline-flex;align-items:center;cursor:pointer;color:var(--text-secondary);background:transparent;">
                                                    + Add
                                                </span>
                                                <div x-show="worldCreatorAddTraitForm && worldCreatorAddTraitForm.catId === cat.id && worldCreatorAddTraitForm.groupLabel === group.label"
                                                    style="display:flex;flex-direction:column;gap:4px;width:100%;margin-top:2px;">
                                                    <input type="text" x-model="worldCreatorAddTraitName" placeholder="Trait name" @keydown.enter="submitWorldCreatorAddTraitForm"
                                                        style="padding:4px 10px;font-size:13px;border:1px solid var(--border);border-radius:8px;background:var(--bg-primary);color:var(--text-primary);width:100%;box-sizing:border-box;" />
                                                    <input type="text" x-model="worldCreatorAddTraitHint" placeholder="Optional hint" @keydown.enter="submitWorldCreatorAddTraitForm"
                                                        style="padding:4px 10px;font-size:13px;border:1px solid var(--border);border-radius:8px;background:var(--bg-primary);color:var(--text-primary);width:100%;box-sizing:border-box;" />
                                                    <div style="display:flex;gap:4px;">
                                                        <button @click="submitWorldCreatorAddTraitForm"
                                                            style="padding:3px 14px;font-size:12px;background:var(--accent);color:white;border:none;border-radius:8px;cursor:pointer;">Save</button>
                                                        <button @click="closeWorldCreatorAddTraitForm"
                                                            style="padding:3px 14px;font-size:12px;background:transparent;color:var(--text-secondary);border:1px solid var(--border);border-radius:8px;cursor:pointer;">Cancel</button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>

                        <div x-show="Object.keys(worldCreatorSelectedTraits).some(k => worldCreatorSelectedTraits[k].length > 0)"
                            style="padding:12px 16px;background:rgba(217,119,6,0.08);border:1px solid rgba(217,119,6,0.2);border-radius:8px;">
                            <div style="font-size:12px;font-weight:700;color:var(--accent);margin-bottom:6px;">Selected Traits</div>
                            <div style="display:flex;flex-wrap:wrap;gap:4px;">
                                <template x-for="(ids, catId) in worldCreatorSelectedTraits" :key="catId">
                                    <template x-for="traitId in ids" :key="traitId">
                                        <span style="display:inline-block;font-size:12px;color:var(--text-secondary);background:var(--bg-primary);padding:2px 8px;border-radius:4px;border:1px solid var(--border);"
                                            x-text="window.WorldCreator.getTraitLabel(catId, traitId)"></span>
                                    </template>
                                </template>
                            </div>
                        </div>
                    </div>
                    <div style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
                        <div style="flex:1;overflow:auto;padding:16px 20px;" id="worldCreatorChat">
                            <div x-show="worldCreatorChatHistory.length === 0"
                                style="text-align:center;color:var(--text-secondary);font-size:13px;padding:40px 20px;">
                                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:12px;opacity:0.3;"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                                <p>Select traits on the left, then use the chat below to flesh out your world with AI assistance.</p>
                            </div>
                            <template x-for="(msg, idx) in worldCreatorChatHistory" :key="idx">
                                <div style="margin-bottom:16px;padding:12px 16px;border-radius:8px;max-width:85%;"
                                    :style="msg.role === 'user' ? 'background:rgba(217,119,6,0.12);margin-left:auto;border:1px solid rgba(217,119,6,0.25);' : 'background:var(--bg-primary);border:1px solid var(--border);'">
                                    <div style="font-size:11px;font-weight:600;color:var(--text-secondary);margin-bottom:4px;text-transform:uppercase;display:flex;align-items:center;gap:6px;">
                                        <span x-text="msg.role === 'user' ? 'You' : 'Assistant'"></span>
                                        <button x-show="msg.role === 'assistant' && msg.content && worldCreatorEditingIdx !== idx"
                                            @click="worldCreatorEditingIdx = idx; worldCreatorEditingBuffer = msg.content"
                                            style="cursor:pointer;background:none;border:none;padding:0;font-size:12px;opacity:0.4;transition:opacity 0.15s;"
                                            @mouseover="$el.style.opacity='1'" @mouseout="$el.style.opacity='0.4'"
                                            title="Edit response">✏️</button>
                                        <button @click="deleteWorldCreatorMessage(idx)"
                                            style="cursor:pointer;background:rgba(200,60,60,0.12);border:none;padding:2px 7px;border-radius:4px;font-size:14px;opacity:0.75;transition:opacity 0.15s;margin-left:auto;line-height:1.4;"
                                            @mouseover="$el.style.opacity='1'" @mouseout="$el.style.opacity='0.75'"
                                            title="Delete this message">✕</button>
                                    </div>
                                    <template x-if="worldCreatorEditingIdx !== idx">
                                        <div style="font-size:13px;color:var(--text-primary);line-height:1.6;white-space:pre-wrap;"
                                            x-text="msg.content || (msg.role === 'assistant' ? 'Thinking...' : '')"></div>
                                    </template>
                                    <template x-if="worldCreatorEditingIdx === idx">
                                        <div>
                                            <textarea x-model="worldCreatorEditingBuffer"
                                                style="width:100%;min-height:80px;padding:8px 10px;background:var(--bg-primary);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);font-size:13px;resize:vertical;box-sizing:border-box;font-family:inherit;"></textarea>
                                            <div style="display:flex;gap:6px;margin-top:6px;">
                                                <button class="btn btn-primary" style="font-size:11px;padding:4px 12px;"
                                                    @click="worldCreatorChatHistory[worldCreatorEditingIdx].content = worldCreatorEditingBuffer; worldCreatorChatHistory = worldCreatorChatHistory.slice(); worldCreatorEditingIdx = null">Save</button>
                                                <button class="btn btn-secondary" style="font-size:11px;padding:4px 12px;"
                                                    @click="worldCreatorEditingIdx = null">Cancel</button>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                        <div style="padding:8px 20px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:4px;flex-shrink:0;align-items:center;">
                            <template x-for="tpl in worldCreatorInstructionTemplates" :key="tpl.id">
                                <button class="btn btn-secondary"
                                    style="font-size:11px;padding:4px 10px;"
                                    @click="sendWorldCreatorInstruction(tpl)"
                                    x-text="tpl.label"></button>
                            </template>
                            <button class="btn btn-secondary" style="font-size:13px;padding:4px 8px;margin-left:auto;flex-shrink:0;"
                                @click="openWorldCreatorInstructionEditor()" title="Edit instruction templates">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                            </button>
                        </div>
                        <div style="padding:10px 20px 14px;border-top:1px solid var(--border);flex-shrink:0;">
                            <div style="display:flex;gap:8px;">
                                <input type="text" x-model="worldCreatorInput" placeholder="Type a message or custom instruction..."
                                    style="flex:1;padding:10px 14px;background:var(--bg-primary);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);font-size:13px;"
                                    @keydown.enter.prevent="sendWorldCreatorMessage()">
                                <button class="btn btn-primary" @click="sendWorldCreatorMessage()"
                                    x-show="!worldCreatorGenerating"
                                    :disabled="!worldCreatorInput.trim()">
                                    Send
                                </button>
                                <button class="btn btn-danger" @click="stopWorldCreatorGeneration()"
                                    x-show="worldCreatorGenerating"
                                    style="font-size:13px;padding:8px 14px;">
                                    ⏹ Stop
                                </button>
                            </div>
                            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">
                                <button class="btn btn-secondary" style="font-size:12px;padding:6px 14px;"
                                    @click="previewWorldCreatorEntry()" :disabled="!worldCreatorName && Object.keys(worldCreatorSelectedTraits).every(k => worldCreatorSelectedTraits[k].length === 0) && worldCreatorChatHistory.length === 0">
                                    👁️ Preview
                                </button>
                                <div style="display:flex;align-items:center;gap:6px;">
                                    <span style="font-size:11px;color:var(--text-secondary);flex-shrink:0;">Max:</span>
                                    <input type="number" x-model="creatorTokenBudget" min="100" max="4000" step="100"
                                        style="width:70px;padding:4px 6px;background:var(--bg-primary);border:1px solid var(--border);border-radius:4px;color:var(--text-primary);font-size:12px;text-align:center;">
                                </div>
                                <button class="btn btn-primary" style="font-size:13px;padding:8px 20px;"
                                    @click="adoptWorldCreatorEntry()"
                                    :disabled="!worldCreatorName">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17"/></svg> Adopt into Compendium
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template x-if="showWorldCreatorPreview">
        <div class="modal-overlay" @click.self="showWorldCreatorPreview = false" style="z-index:9600;">
            <div style="width:min(900px,96%);height:min(700px,90vh);background:var(--bg-secondary);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;">
                <div style="display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid var(--border);flex-shrink:0;">
                    <div style="display:flex;align-items:center;gap:10px;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                        <h3 style="margin:0;font-size:18px;color:var(--text-primary);">World Preview</h3>
                    </div>
                    <button class="btn btn-secondary" @click="showWorldCreatorPreview = false">Close</button>
                </div>
                <div style="flex:1;overflow:auto;padding:20px 24px;" class="cc-preview-body">
                    <div x-html="worldCreatorPreviewHtml" class="compendium-rendered"></div>
                </div>
                <div style="display:flex;justify-content:flex-end;gap:10px;padding:14px 24px;border-top:1px solid var(--border);flex-shrink:0;">
                    <button class="btn btn-secondary" @click="showWorldCreatorPreview = false">← Back to Editor</button>
                    <button class="btn btn-primary"
                        @click="showWorldCreatorPreview = false; adoptWorldCreatorEntry()"
                        :disabled="!worldCreatorName"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17"/></svg> Adopt into Compendium</button>
                </div>
            </div>
        </div>
    </template>

    <template x-if="worldCreatorShowInstructionEditor">
        <div class="modal-overlay" @click.self="closeWorldCreatorInstructionEditor()" style="z-index:9700;">
            <div style="width:min(640px,96%);max-height:min(600px,85vh);background:var(--bg-secondary);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;">
                <div style="display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid var(--border);flex-shrink:0;">
                    <h3 style="margin:0;font-size:18px;color:var(--text-primary);">Instruction Templates</h3>
                    <button class="btn btn-secondary" @click="closeWorldCreatorInstructionEditor()">Done</button>
                </div>
                <div style="padding:16px 24px;border-bottom:1px solid var(--border);">
                    <label style="font-size:12px;font-weight:600;display:block;margin-bottom:6px;color:var(--text-primary);">System Prompt</label>
                    <textarea x-model="worldCreatorEditorSystemPrompt" rows="6" style="width:100%;padding:10px;background:var(--bg-primary);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);font-size:13px;resize:vertical;box-sizing:border-box;font-family:inherit;"></textarea>
                    <button class="btn btn-secondary" style="font-size:11px;padding:4px 10px;margin-top:6px;" @click="resetWorldCreatorSystemPrompt()">Reset to Default</button>
                </div>
                <div style="flex:1;overflow:auto;padding:16px 24px;">
                    <template x-for="(tpl, idx) in worldCreatorInstructionTemplates" :key="tpl.id">
                        <div style="margin-bottom:16px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg-primary);">
                            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                                <input type="text" x-model="tpl.label" style="font-weight:600;font-size:13px;padding:4px 8px;background:transparent;border:1px solid var(--border);border-radius:4px;color:var(--text-primary);flex:1;">
                                <button x-show="tpl.id.startsWith('custom_')" @click="deleteWorldCreatorInstructionTemplate(tpl.id)" style="cursor:pointer;background:rgba(200,60,60,0.12);border:none;padding:2px 8px;border-radius:4px;font-size:14px;color:#e74c3c;margin-left:8px;">✕</button>
                            </div>
                            <textarea x-model="tpl.message" rows="2" style="width:100%;padding:6px 8px;background:transparent;border:1px solid var(--border);border-radius:4px;color:var(--text-primary);font-size:12px;resize:vertical;box-sizing:border-box;font-family:inherit;"></textarea>
                        </div>
                    </template>
                    <button class="btn btn-secondary" @click="addWorldCreatorInstructionTemplate()" style="font-size:12px;padding:6px 14px;">+ Add Template</button>
                    <button class="btn btn-secondary" @click="resetWorldCreatorInstructionTemplates()" style="font-size:12px;padding:6px 14px;margin-left:6px;">Reset to Default</button>
                </div>
            </div>
        </div>
    </template>
