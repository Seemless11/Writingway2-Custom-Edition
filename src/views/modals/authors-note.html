        <!-- Author's Note Modal -->
        <template x-if="showAuthorsNote">
            <div class="modal-overlay" @click.self="showAuthorsNote = false" @keydown.escape.window="showAuthorsNote = false">
                <div class="modal" style="max-width:520px;">
                    <div class="modal-header">
                        <h3 style="margin:0;">✒️ Author's Note</h3>
                        <button class="btn btn-secondary" @click="showAuthorsNote = false">Close</button>
                    </div>
                    <div class="modal-body" style="display:flex;flex-direction:column;gap:12px;">
                        <p style="font-size:12px;color:var(--text-secondary);margin:0;line-height:1.5;">
                            A standing direction injected into <strong>every</strong> generation for this project — use it to set theme, tone, style, pacing or narrative direction without writing it into each beat. The model follows it but never quotes or mentions it.
                        </p>
                        <textarea x-model="authorsNoteDraft" rows="7"
                            placeholder="e.g. Keep a bleak, literary tone. Slow, sensory prose. Hold unresolved tension; avoid tidy resolutions. Close third-person interiority throughout."
                            style="width:100%;padding:10px;background:var(--bg-primary);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);font-family:inherit;font-size:13px;resize:vertical;line-height:1.5;"
                            @keydown.ctrl.enter.prevent="saveAuthorsNote()"
                            @keydown.meta.enter.prevent="saveAuthorsNote()"></textarea>
                        <div style="display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--text-tertiary);">
                            <span x-text="(authorsNoteDraft || '').length + ' characters'"></span>
                            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--text-primary);">
                                <input type="checkbox" x-model="authorsNoteEnabled" @change="onAuthorsNoteEnabledChange()" style="width:14px;height:14px;cursor:pointer;">
                                Include in prompts
                            </label>
                        </div>
                        <div style="display:flex;gap:8px;justify-content:flex-end;align-items:center;">
                            <span x-show="authorsNoteSaveStatus" x-text="authorsNoteSaveStatus" style="font-size:11px;color:var(--accent);margin-right:auto;"></span>
                            <button class="btn btn-secondary" @click="clearAuthorsNote()"
                                x-show="(authorsNoteDraft || '').length > 0 || !!authorsNote">Clear</button>
                            <button class="btn btn-primary" @click="saveAuthorsNote()">Save</button>
                        </div>
                    </div>
                </div>
            </div>
        </template>
