        <!-- Chapter Actions Modal -->
        <template x-if="showChapterActionsModal && chapterActionsTarget">
            <div class="modal-overlay" @click.self="showChapterActionsModal = false" @keydown.escape.window="showChapterActionsModal = false">
                <div class="modal" style="max-width:360px;">
                    <h3 style="margin-bottom:16px;display:flex;align-items:center;gap:8px;">
                        <span style="font-size:20px;">📁</span>
                        <span x-text="chapterActionsTarget.title"></span>
                    </h3>

                    <!-- Action Buttons Grid -->
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;">
                        <button class="btn btn-secondary" style="display:flex;align-items:center;justify-content:center;gap:6px;"
                            @click="chapterActionsTarget.expanded = !chapterActionsTarget.expanded; showChapterActionsModal = false"
                            x-text="chapterActionsTarget.expanded ? '📂 Collapse' : '📂 Expand'">
                        </button>
                        <button class="btn btn-secondary" style="display:flex;align-items:center;justify-content:center;gap:6px;"
                            @click="openRenameChapterModal(chapterActionsTarget.id); showChapterActionsModal = false">
                            ✏️ Rename
                        </button>
                        <button class="btn btn-secondary" style="display:flex;align-items:center;justify-content:center;gap:6px;"
                            @click="moveChapterUp(chapterActionsTarget.id); showChapterActionsModal = false">
                            ⬆️ Move up
                        </button>
                        <button class="btn btn-secondary" style="display:flex;align-items:center;justify-content:center;gap:6px;"
                            @click="moveChapterDown(chapterActionsTarget.id); showChapterActionsModal = false">
                            ⬇️ Move down
                        </button>
                    </div>

                        <!-- POV Character (project-level) -->
                        <div style="margin-bottom:16px;">
                            <label style="font-size:12px;color:var(--text-secondary);display:block;margin-bottom:6px;">
                                POV Character:
                            </label>
                            <select class="move-select" style="width:100%;padding:10px 12px;"
                                @change="if($event.target.value !== undefined) { 
                                    const val = $event.target.value || '';
                                    povCharacter = val;
                                    currentProject.povCharacter = val;
                                    db.projects.update(currentProject.id, { povCharacter: val, modified: new Date(), updatedAt: Date.now() });
                                }">
                                <option value="">Project default</option>
                                <template x-for="char in (compendiumLists['characters'] || []).filter(c => c.isPovCharacter)"
                                    :key="char.id">
                                    <option :value="char.title"
                                        :selected="(currentProject.povCharacter || '') === char.title"
                                        x-text="char.title"></option>
                                </template>
                            </select>
                        </div>

                    <!-- Summary Button (full width) -->
                    <button class="btn btn-secondary" style="width:100%;display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:16px;"
                        @click="openChapterSummary(chapterActionsTarget.id); showChapterActionsModal = false">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg> Summary
                    </button>

                    <!-- Delete Button (separate, styled as danger) -->
                    <button class="btn" style="width:100%;background:rgba(239,68,68,0.15);color:#ef4444;border:1px solid rgba(239,68,68,0.3);"
                        @click="deleteChapter(chapterActionsTarget.id); showChapterActionsModal = false">
                        🗑️ Delete chapter
                    </button>

                    <!-- Close Button -->
                    <div style="margin-top:16px;text-align:center;">
                        <button class="btn btn-secondary" @click="showChapterActionsModal = false">
                            Cancel
                        </button>
                    </div>
                </div>
            </div>
        </template>
