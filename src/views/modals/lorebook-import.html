    <!-- Lorebook Import Options Modal -->
    <template x-if="showLorebookImport">
        <div class="modal-overlay" @click.self="closeLorebookImport()" style="z-index:9800;">
            <div style="width:min(500px,90%);background:var(--bg-secondary);border:1px solid var(--border);border-radius:12px;overflow:hidden;">
                <div style="display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid var(--border);">
                    <h3 style="margin:0;font-size:18px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17"/></svg> Import Lorebook</h3>
                    <button class="btn btn-secondary" @click="closeLorebookImport()">Cancel</button>
                </div>
                <div style="padding:24px;">
                    <div style="margin-bottom:12px;">
                        <p style="margin:0 0 4px;">Book: <strong x-text="lorebookImportBookName"></strong></p>
                        <p style="margin:0;">Entries: <strong x-text="lorebookImportEntryCount"></strong></p>
                    </div>
                    <div style="margin:16px 0;">
                        <label style="display:block;margin-bottom:6px;font-weight:600;color:var(--text-primary);">Target category</label>
                        <select x-model="lorebookImportCategory" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;background:var(--bg-primary);color:var(--text-primary);">
                            <template x-for="cat in compendiumCategories" :key="cat">
                                <option :value="cat" x-text="cat" :selected="cat === 'lore'"></option>
                            </template>
                        </select>
                    </div>
                    <div style="margin:16px 0;">
                        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--text-primary);">
                            <input type="checkbox" x-model="lorebookImportIncludeKeys" style="cursor:pointer;">
                            <span>Include ST trigger keys as tags <span style="color:var(--text-secondary);font-size:12px;">(max 9 per entry; extra keys reported)</span></span>
                        </label>
                    </div>
                    <template x-if="lorebookImportTruncations.length > 0">
                        <div style="margin:16px 0;padding:12px;background:rgba(255,193,7,0.1);border:1px solid rgba(255,193,7,0.3);border-radius:6px;">
                            <p style="margin:0 0 8px;font-weight:600;color:var(--warning);">⚠️ Tag cap warnings</p>
                            <ul style="margin:0;padding-left:20px;font-size:12px;color:var(--text-primary);">
                                <template x-for="t in lorebookImportTruncations" :key="t.title">
                                    <li x-text="t.title + ': ' + t.dropped + ' key(s) dropped (10 tag cap)'"></li>
                                </template>
                            </ul>
                        </div>
                    </template>
                    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:20px;">
                        <button class="btn btn-primary" @click="confirmLorebookImport()" :disabled="lorebookImporting">
                            <span x-show="!lorebookImporting">Import</span>
                            <span x-show="lorebookImporting">Importing...</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </template>
