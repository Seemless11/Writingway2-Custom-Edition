        <!-- Update Available Dialog -->
        <template x-if="showUpdateDialog && updateAvailable">
            <div class="modal-overlay" @click.self="dontRemindUpdate && window.UpdateChecker.dismissUpdate(updateAvailable.version); showUpdateDialog = false" style="z-index:10000;">
                <div class="modal" style="max-width:600px;">
                    <div class="modal-header">
                        <h3 style="margin:0;display:flex;align-items:center;gap:8px;">
                            <span style="font-size:24px;">🎉</span>
                            Update Available!
                        </h3>
                        <button class="btn-icon" @click="dontRemindUpdate && window.UpdateChecker.dismissUpdate(updateAvailable.version); showUpdateDialog = false">×</button>
                    </div>
                    <div class="modal-body">
                        <div
                            style="background:linear-gradient(135deg,rgba(217,119,6,0.1),rgba(217,119,6,0.06));border:1px solid rgba(217,119,6,0.3);border-radius:8px;padding:16px;margin-bottom:16px;">
                            <div style="font-size:18px;font-weight:600;margin-bottom:8px;color:var(--accent);">
                                New update available!
                            </div>
                            <div style="font-size:13px;color:var(--text-secondary);">
                                Latest commit (<span x-text="updateAvailable.version"></span>) from <span
                                    x-text="updateAvailable.commitDate"></span>
                            </div>
                        </div>

                        <div style="margin-bottom:16px;">
                            <div style="font-weight:600;margin-bottom:8px;color:var(--text-primary);">Latest Change:
                            </div>
                            <div style="background:var(--bg-tertiary);padding:12px;border-radius:6px;">
                                <div style="margin:0;font-size:13px;line-height:1.6;color:var(--text-secondary);"
                                    x-text="updateAvailable.message"></div>
                            </div>
                        </div>

                        <!-- Update Already Staged -->
                        <template x-if="updateAvailable.updateStaged && !updateAvailable.downloadSuccess">
                            <div style="background:rgba(40,167,69,0.1);border:1px solid rgba(40,167,69,0.3);border-radius:6px;padding:12px;margin-bottom:16px;">
                                <div style="font-size:13px;color:var(--text-secondary);line-height:1.5;">
                                    <strong style="color:#28a745;">✓ Update ready to install!</strong><br>
                                    Restart Writingway manually to apply the update.
                                </div>
                            </div>
                        </template>

                        <!-- Download Success -->
                        <template x-if="updateAvailable.downloadSuccess">
                            <div style="background:rgba(40,167,69,0.1);border:1px solid rgba(40,167,69,0.3);border-radius:6px;padding:12px;margin-bottom:16px;">
                                <div style="font-size:13px;color:var(--text-secondary);line-height:1.5;">
                                    <strong style="color:#28a745;">✓ Downloaded successfully!</strong><br>
                                    Restart Writingway manually to apply the update.<br>
                                    <span style="font-size:12px;opacity:0.8;">Your projects are stored in the browser and will be preserved.</span>
                                </div>
                            </div>
                        </template>

                        <!-- Download Error -->
                        <template x-if="updateAvailable.downloadError">
                            <div style="background:rgba(220,53,69,0.1);border:1px solid rgba(220,53,69,0.3);border-radius:6px;padding:12px;margin-bottom:16px;">
                                <div style="font-size:13px;color:var(--text-secondary);line-height:1.5;">
                                    <strong style="color:#dc3545;">Download failed</strong><br>
                                    <span x-text="updateAvailable.downloadError"></span>
                                </div>
                            </div>
                        </template>

                        <!-- Updater Not Available -->
                        <template x-if="!updateAvailable.updaterAvailable && !updateAvailable.updateStaged">
                            <div style="background:rgba(255,193,7,0.1);border:1px solid rgba(255,193,7,0.3);border-radius:6px;padding:12px;margin-bottom:16px;">
                                <div style="font-size:12px;color:var(--text-secondary);line-height:1.5;">
                                    <strong>⚠️ Updater service not running</strong><br>
                                    The in-app updater requires Writingway to be started from its launcher script.<br>
                                    You can still update manually from GitHub.
                                </div>
                            </div>
                        </template>

                        <!-- Manual Update Instructions (shown when updater not available) -->
                        <template x-if="!updateAvailable.updaterAvailable && !updateAvailable.updateStaged">
                            <div style="background:var(--bg-tertiary);border-radius:6px;padding:12px;margin-bottom:16px;">
                                <div style="font-size:12px;color:var(--text-secondary);line-height:1.5;">
                                    <strong>Manual update:</strong>
                                    <ol style="margin:8px 0 0 0;padding-left:20px;">
                                        <li>Download the new version from GitHub</li>
                                        <li>Extract to a new folder</li>
                                        <li>Your projects are stored in the browser and will be available</li>
                                    </ol>
                                </div>
                            </div>
                        </template>

                        <!-- Don't Remind Me Checkbox -->
                        <template x-if="!currentVersionDismissed">
                            <div style="margin-bottom:16px;display:flex;align-items:center;gap:8px;font-size:13px;">
                                <input type="checkbox" id="dontRemindUpdate" x-model="dontRemindUpdate">
                                <label for="dontRemindUpdate" style="color:var(--text-secondary);cursor:pointer;">Don't remind me again for this version</label>
                            </div>
                        </template>
                        <template x-if="currentVersionDismissed">
                            <div style="margin-bottom:16px;padding:8px 12px;background:var(--bg-tertiary);border-radius:6px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;">
                                <span style="color:var(--text-secondary);">Reminder dismissed for this version</span>
                                <button class="btn btn-sm" @click="window.UpdateChecker.resetDismissedUpdate(); currentVersionDismissed = false">Undo</button>
                            </div>
                        </template>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" @click="dontRemindUpdate && window.UpdateChecker.dismissUpdate(updateAvailable.version); showUpdateDialog = false">Maybe Later</button>

                        <!-- Download Button (when updater available and not yet staged/downloading) -->
                        <template x-if="updateAvailable.updaterAvailable && !updateAvailable.updateStaged && !updateAvailable.downloading && !updateAvailable.downloadSuccess">
                            <button class="btn btn-primary" @click="window.UpdateChecker.handleDownload($data)">
                                ⬇ Download Update
                            </button>
                        </template>

                        <!-- Downloading indicator -->
                        <template x-if="updateAvailable.downloading">
                            <button class="btn btn-primary" disabled style="opacity:0.7;display:flex;align-items:center;gap:6px;">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="animate-spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> Downloading...
                            </button>
                        </template>

                        <!-- View on GitHub (always available) -->
                        <button class="btn" :class="updateAvailable.updaterAvailable ? 'btn-secondary' : 'btn-primary'"
                            @click="window.open(updateAvailable.url, '_blank');">
                            View on GitHub
                        </button>
                    </div>
                </div>
            </div>
        </template>
