        <!-- Import from Novelcrafter Modal -->
        <template x-if="showNovelcrafterImportModal">
            <div class="modal-overlay" @click.self="showNovelcrafterImportModal = false">
                <div class="modal" style="max-width:600px;">
                    <h3>Import from Novelcrafter</h3>
                    <div
                        style="background:rgba(100,200,255,0.1);border:1px solid rgba(100,200,255,0.3);border-radius:8px;padding:16px;margin:16px 0;line-height:1.6;">
                        <p style="margin:0 0 12px 0;font-weight:600;color:#66ccff;">ℹ️ Import Notes:</p>
                        <p style="margin:0 0 8px 0;font-size:14px;"><strong>Supported formats:</strong></p>
                        <ul style="margin:0 0 12px 0;padding-left:24px;font-size:13px;">
                            <li>Novelcrafter Markdown export (<code>.md</code>)</li>
                            <li>Novelcrafter full ZIP export (<code>.zip</code>) — imports novel + characters into Compendium</li>
                        </ul>
                        <p style="margin:0 0 8px 0;font-size:14px;"><strong>How it works:</strong></p>
                        <ul style="margin:0 0 0 0;padding-left:24px;font-size:13px;">
                            <li>Headings (<code>#</code>/<code>##</code>/<code>###</code>) are used to detect chapters and scenes</li>
                            <li>Scene dividers (<code>* * *</code>, <code>---</code>) are detected when no scene headings are present</li>
                            <li>ZIP files also import character entries into the Compendium</li>
                        </ul>
                    </div>
                    <p style="margin:16px 0 8px 0;font-size:14px;color:rgba(255,255,255,0.8);">Select your Novelcrafter export file (<code>.md</code> or <code>.zip</code>):</p>
                    <input type="file"  @change="importFromNovelcrafter($event)"
                        style="margin:8px 0;padding:8px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:4px;color:inherit;width:100%;">
                    <div class="modal-buttons" style="margin-top:20px;">
                        <button class="btn btn-secondary" @click="showNovelcrafterImportModal = false"
                            :disabled="novelcrafterImportInProgress">Cancel</button>
                    </div>
                </div>
            </div>
        </template>
