                <div class="sidebar" :class="{ 'collapsed': sidebarCollapsed }">
                    <div class="sidebar-header" style="position:relative;">
                        <h1>Writingway</h1>
                        <p>AI-Powered Creative Writing</p>

                        <!-- Mode Tab Bar -->
                        <div style="display:flex;border-bottom:1px solid var(--border);">
                            <button @click="switchWritingMode('editor')"
                                :style="writingMode === 'editor' ? 'flex:1;padding:8px;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:12px;font-weight:600;border-right:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:4px;' : 'flex:1;padding:8px;background:transparent;color:var(--text-secondary);border:none;cursor:pointer;font-size:12px;border-right:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:4px;'"
                                title="Story Editor Mode"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg> Editor</button>
                            <button @click="switchWritingMode('chat')"
                                :style="writingMode === 'chat' ? 'flex:1;padding:8px;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:4px;' : 'flex:1;padding:8px;background:transparent;color:var(--text-secondary);border:none;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;gap:4px;'"
                                title="Character Chat Mode"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg> Chat</button>
                        </div>

                        <!-- Chat Actions (below mode tabs, only in chat mode) -->
                        <div x-show="writingMode === 'chat'" x-cloak style="padding:0 0 8px;border-bottom:1px solid var(--border);margin-bottom:0;">
                            <div style="display:flex;flex-direction:column;gap:4px;padding:8px 12px 4px;">
                                <!-- RP Toggle -->
                                <label class="toggle-switch" style="padding:4px 8px;">
                                    <input type="checkbox" x-model="chatRoleplayFormatting"
                                        @change="window.ChatMode.toggleChatRoleplayFormatting($data)">
                                    <div class="toggle-track"><div class="toggle-thumb"></div></div>
                                    <span class="toggle-label">RP Formatting</span>
                                </label>
                                <!-- Action row -->
                                <div style="display:flex;gap:4px;flex-wrap:wrap;">
                                    <button class="btn btn-secondary" @click="window.ChatMode.showCharacterInfo($data)"
                                        style="padding:3px 6px;font-size:11px;display:flex;align-items:center;gap:4px;" title="View/Edit Character">
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg> Character</button>
                                    <button class="btn btn-secondary" @click="window.ChatMode.loadCharacterRoster($data)"
                                        style="padding:3px 6px;font-size:11px;display:flex;align-items:center;gap:4px;" title="Switch Character">
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg> Switch</button>
                                    <button class="btn btn-secondary" @click="window.ChatMode.startNewCharacterChat($data, null)"
                                        style="padding:3px 6px;font-size:11px;display:flex;align-items:center;gap:4px;" title="New Conversation">
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg> New Chat</button>
                                </div>

                                <!-- Bottom action row -->
                                <div style="display:flex;gap:4px;">
                                    <button class="btn btn-secondary" @click="showPersonaSettings = true"
                                        style="padding:3px 6px;font-size:11px;flex:1;display:flex;align-items:center;justify-content:center;gap:4px;" title="Persona Settings">
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Persona</button>
                                    <button class="btn btn-secondary" @click="openLorebookPanel()"
                                        style="padding:3px 6px;font-size:11px;flex:1;display:flex;align-items:center;justify-content:center;gap:4px;" title="Lorebook">
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17"/></svg> Lorebook</button>
                                    <button class="btn btn-danger" @click="window.ChatMode.deleteCharacterSession($data)"
                                        style="padding:3px 6px;font-size:11px;flex:1;color:#ef4444;display:flex;align-items:center;justify-content:center;gap:4px;" title="Delete Conversation">
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg> Delete</button>
                                </div>
                                <!-- Collapsible Conversations List -->
                                <div x-show="chatCharacter" x-cloak>
                                    <div class="comp-category"
                                         @click="chatSessionsOpen = !chatSessionsOpen"
                                         tabindex="0"
                                         style="cursor:pointer;padding:4px 8px;font-size:11px;background:var(--bg-tertiary);border-radius:6px;display:flex;align-items:center;justify-content:space-between;margin-top:4px;">
                                        <span style="display:flex;align-items:center;gap:4px;">
                                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> Conversations <span style="color:var(--text-tertiary);font-weight:400;" x-text="'(' + chatSessions.length + ')'"></span>
                                        </span>
                                        <div style="display:flex;align-items:center;gap:4px;">
                                            <button @click.stop="window.ChatMode.startNewCharacterChat($data, null)"
                                                style="background:none;border:none;cursor:pointer;color:var(--accent);padding:2px;display:flex;align-items:center;" title="New Chat">
                                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                                            </button>
                                            <svg x-show="!chatSessionsOpen" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                                            <svg x-show="chatSessionsOpen" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                                        </div>
                                    </div>
                                    <div x-show="chatSessionsOpen" x-cloak style="padding:4px 0;display:flex;flex-direction:column;gap:1px;max-height:180px;overflow-y:auto;">
                                        <template x-for="(session, sidx) in chatSessions" :key="sidx">
                                            <div @click="window.ChatMode.switchChatSession($data, session); window.ChatMode.loadChatSessions($data)"
                                                style="padding:5px 10px;border-radius:4px;cursor:pointer;font-size:11px;display:flex;align-items:center;gap:6px;transition:background 0.15s;"
                                                :style="chatCharacterSessionId === session.id ? 'background:rgba(217,119,6,0.1);color:var(--accent);' : 'color:var(--text-secondary);'"
                                                @mouseenter="$el.style.background= chatCharacterSessionId === session.id ? 'rgba(217,119,6,0.15)' : 'var(--bg-tertiary)'"
                                                @mouseleave="$el.style.background= chatCharacterSessionId === session.id ? 'rgba(217,119,6,0.1)' : 'transparent'">
                                                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                                                <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;" x-text="session.title || 'Chat ' + (sidx + 1)"></span>
                                                <span x-show="chatCharacterSessionId === session.id" style="color:var(--accent);font-size:9px;">✓</span>
                                            </div>
                                        </template>
                                        <div x-show="chatSessions.length === 0" style="color:var(--text-tertiary);font-size:11px;padding:8px;text-align:center;">
                                            No conversations yet
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Header Actions -->
                        <div style="position:absolute;top:12px;right:12px;display:flex;align-items:center;gap:8px;">
                            <button class="btn btn-secondary" @click.stop="saveProjectToDisk()"
                                :disabled="!currentProject || filesystemSaving"
                                :title="filesystemSaving ? 'Saving project to disk...' : 'Save current project to disk'"
                                style="padding:6px 12px;min-width:44px;display:flex;align-items:center;justify-content:center;"
                                aria-label="Save current project to disk">
                                <span x-show="!filesystemSaving">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg>
                                </span>
                                <span x-show="filesystemSaving">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="animate-spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
                                </span>
                            </button>

                            <div x-data="{ mainMenuOpen: false }">
                                <button class="btn btn-secondary" @click.stop="mainMenuOpen = !mainMenuOpen"
                                    style="padding:6px 12px;display:flex;align-items:center;justify-content:center;" title="Main Menu">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16"/><path d="M4 6h16"/><path d="M4 18h16"/></svg>
                                </button>
                                <div x-show="mainMenuOpen" x-cloak @click.away="mainMenuOpen = false" x-transition
                                    class="action-menu" style="right:0;left:auto;min-width:200px;">
                                    <button @click.stop="backToProjects(); mainMenuOpen=false" style="display:flex;align-items:center;gap:8px;">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg> Back to Projects</button>
                                    <div style="border-top:1px solid var(--border);margin:6px 0"></div>
                                    <button @click.stop="showNewProjectModal = true; mainMenuOpen=false" style="display:flex;align-items:center;gap:8px;">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg> New Project</button>
                                    <button
                                        @click.stop="document.getElementById('importProjectInput').click(); mainMenuOpen=false" style="display:flex;align-items:center;gap:8px;">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg> Import Project</button>
                                    <button @click.stop="showNovelcrafterImportModal = true; mainMenuOpen=false" style="display:flex;align-items:center;gap:8px;">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17"/></svg> Import Novelcrafter</button>
                                    <div style="border-top:1px solid var(--border);margin:6px 0"></div>
                                    <button @click.stop="exportProject(); mainMenuOpen=false" :disabled="!currentProject" style="display:flex;align-items:center;gap:8px;">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg> Export Current Project</button>
                                    <div style="border-top:1px solid var(--border);margin:6px 0"></div>
                                    <div style="padding:8px 12px;">
                                        <div style="font-size:11px;color:var(--text-secondary);margin-bottom:6px;">Accent</div>
                                        <div style="display:flex;gap:5px;flex-wrap:wrap;">
                                            <template x-for="c in ['#D97706','#B45309','#92400E','#7C2D12','#6B21A8','#3730A3','#1E40AF','#0F766E','#065F46','#52525B','#881337','#991B1B']" :key="c">
                                                <button @click="setAccentColor(c); mainMenuOpen=false"
                                                    :style="'width:20px;height:20px;border-radius:50%;border:2px solid ' + (accentColor === c ? 'var(--text-primary)' : 'transparent') + ';background:' + c + ';cursor:pointer;flex-shrink:0;'"
                                                    :title="c"></button>
                                            </template>
                                        </div>
                                    </div>
                                    <div style="border-top:1px solid var(--border);margin:6px 0"></div>
                                    <button @click.stop="showWorkshopChat = true; mainMenuOpen=false" style="display:flex;align-items:center;gap:8px;">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> Workshop Chat</button>
                                    <button @click.stop="showAISettings = true; mainMenuOpen=false" style="display:flex;align-items:center;gap:8px;">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg> AI Settings</button>
                                    <button @click.stop="showPromptsPanel = true; mainMenuOpen=false" style="display:flex;align-items:center;gap:8px;">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg> Manage Prompts</button>
                                    <button @click.stop="openBackupSettings(); mainMenuOpen=false" style="display:flex;align-items:center;gap:8px;">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg> Cloud Backup</button>
                                    <div style="border-top:1px solid var(--border);margin:6px 0"></div>
                                    <button @click.stop="checkForUpdates(); mainMenuOpen=false"
                                        :disabled="checkingForUpdates">
                                        <span x-show="!checkingForUpdates" style="display:flex;align-items:center;gap:8px;">
                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg> Check for Updates</span>
                                        <span x-show="checkingForUpdates" style="display:flex;align-items:center;gap:8px;">
                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="animate-spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> Checking...</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Hidden file input for import (global scope) -->
                    <input type="file" id="importProjectInput" accept=".zip"
                        @change="importProject($event); $event.target.value = null" style="display:none;">

                    <!-- AI Status -->
                    <div class="ai-status">
                        <div class="ai-status-item"
                            style="cursor:pointer;padding:10px 16px;border-radius:8px;transition:background 0.2s;"
                            @click="showAISettings = !showAISettings"
                            @mouseenter="$el.style.background='rgba(217,119,6,0.1)'"
                            @mouseleave="$el.style.background='transparent'" title="Click to toggle AI settings"
                            aria-label="Toggle AI settings" role="button">
                            <div class="status-dot" :class="aiStatus"></div>
                            <span x-text="aiStatusText"></span>
                            <span style="margin-left:8px;opacity:0.5;font-size:12px;">▼</span>
                        </div>

                        <!-- Backup Status -->
                        <div x-show="backupEnabled" class="ai-status-item"
                            style="cursor:pointer;padding:8px 16px;border-radius:8px;transition:background 0.2s;font-size:12px;"
                            @click="openBackupSettings()" @mouseenter="$el.style.background='rgba(76,175,80,0.1)'"
                            @mouseleave="$el.style.background='transparent'" title="Click for backup settings">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>
                            <span x-text="backupStatus || ('Auto-backup: ' + backupProviderName())"></span>
                        </div>

                    </div>

                    <div x-show="currentProject && writingMode !== 'chat'" class="project-info" x-data="{ openMenu:false }"
                        style="position:relative;padding:16px 12px;border-bottom:2px solid rgba(217,119,6,0.3);">
                        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
                            <h2 style="margin:0;padding-right:8px;">
                                <button class="project-name-button" @click.stop="openCompendium()"
                                    title="Click to toggle Compendium" aria-controls="compendium-panel"
                                    :aria-expanded="showCodexPanel ? 'true' : 'false'"
                                    style="background:none;border:none;padding:8px 12px 8px 0;font-size:18px;font-weight:700;color:var(--color-accent);cursor:pointer;border-radius:6px;transition:all 0.2s;"
                                    @mouseenter="$el.style.background='rgba(217,119,6,0.12)'"
                                    @mouseleave="$el.style.background='transparent'">
                                    <span x-text="currentProject?.name"></span>
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:8px;opacity:0.7;flex-shrink:0;"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17"/></svg>
                                    <template x-if="currentProject?.genres?.length">
                                        <span style="margin-left:6px;font-size:11px;opacity:0.6;font-weight:400;">
                                            <template x-for="(gid, gi) in currentProject?.genres ?? []" :key="gid">
                                                <span>
                                                    <span x-text="(window.GenreDefs?.findGenre(gid)?.icon || '')"></span>
                                                    <span x-text="window.GenreDefs?.findGenre(gid)?.label || gid"></span><span x-show="gi < (currentProject?.genres?.length ?? 1) - 1"> · </span>
                                                </span>
                                            </template>
                                        </span>
                                    </template>
                                </button>
                            </h2>

                            <div style="display:flex;align-items:center;gap:6px;">
                                <button class="menu-button" @click.stop="openMenu = !openMenu"
                                    title="Project menu">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
                                </button>
                                <div x-show="openMenu" x-cloak @click.away="openMenu = false" x-transition
                                    class="action-menu">
                                    <button
                                        @click.stop="showRenameProjectModal = true; renameProjectTargetId = currentProject?.id; renameProjectName = currentProject?.name; renameProjectPov = currentProject?.pov || '3rd person limited'; renameProjectTense = currentProject?.tense || 'past'; renameProjectLanguage = currentProject?.language || 'English'; renameProjectPovCharacter = currentProject?.povCharacter || ''; renameProjectGenres = [...(currentProject?.genres || [])]; openMenu=false">Rename</button>
                                    <div style="border-top:1px solid var(--border);margin:6px 0"></div>
                                    <div style="max-height:200px;overflow:auto;margin-bottom:6px;">
                                        <strong
                                            style="display:block;padding:6px 10px;color:var(--text-secondary);font-size:12px;">Switch
                                            project</strong>
                                        <template x-for="p in projects" :key="p.id">
                                            <button @click.stop="selectProject(p.id); openMenu=false"
                                                style="padding-left:10px;">
                                                <span x-text="p.name"></span>
                                            </button>
                                        </template>
                                    </div>
                                    <div style="border-top:1px solid var(--border);margin:6px 0"></div>
                                    <button @click.stop="exportProject(); openMenu=false">📦 Export Project</button>
                                    <div style="margin-top:6px"></div>
                                    <button @click.stop="showNewProjectModal = true; openMenu=false">➕ New
                                        Project</button>
                                </div>
                            </div>
                        </div>

                        <div class="word-count" x-text="`${totalWords} words`" style="margin-top:6px;"></div>
                    </div>

                    <!-- Scene Search -->
                    <div x-show="currentProject && writingMode !== 'chat'" style="padding:8px 12px;border-bottom:1px solid var(--border);">
                        <input type="text" x-model="sceneSearchQuery" placeholder="🔍 Search scenes..."
                            style="width:100%;padding:8px 12px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);font-size:13px;"
                            @keydown.escape="sceneSearchQuery = ''">
                    </div>

                    <div x-show="writingMode !== 'chat'" class="scene-list">
                        <template x-for="chapter in chapters.filter(ch => !sceneSearchQuery || ch.title.toLowerCase().includes(sceneSearchQuery.toLowerCase()) || (ch.scenes && ch.scenes.some(s => s.title.toLowerCase().includes(sceneSearchQuery.toLowerCase()))))" :key="chapter.id">
                            <div class="chapter-item">
                                <div class="chapter-header" style="align-items:center;gap:8px;cursor:pointer;" @click="currentChapter = chapter">
                                    <div
                                        style="flex:1;display:flex;justify-content:space-between;align-items:center;position:relative;">
                                        <div style="flex:1;display:flex;align-items:center;gap:8px;">
                                            <span class="summary-dot"
                                                :class="{ 'has': chapter.summary && !chapter.summaryStale, 'stale': chapter.summaryStale, 'none': !chapter.summary }"
                                                :title="`${chapter.title}: ${chapter.summary ? (chapter.summaryStale ? 'Summary outdated' : 'Has summary') : 'No summary yet'}`"
                                                :aria-label="`${chapter.title}: ${chapter.summary ? (chapter.summaryStale ? 'Summary outdated' : 'Has summary') : 'No summary yet'}`"></span>
                                            <div style="flex:1;" x-text="chapter.title"></div>
                                            <div
                                                style="font-size:12px;color:var(--text-secondary);display:flex;align-items:center;gap:6px;">
                                                <span x-text="`${chapter.scenes ? chapter.scenes.length : 0}`"></span>
                                            </div>
                                        </div>

                                        <div class="item-actions" style="margin-left:8px;">
                                            <button class="menu-button" 
                                                @click.stop="chapterActionsTarget = chapter; showChapterActionsModal = true"
                                                title="Chapter actions">
                                                ⋯
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <div class="chapter-scenes" x-show="chapter.expanded || sceneSearchQuery">
                                    <template x-for="scene in (chapter.scenes || []).filter(s => !sceneSearchQuery || s.title.toLowerCase().includes(sceneSearchQuery.toLowerCase()))" :key="scene.id">
                                        <div class="scene-item"
                                            :class="{ 'active': currentScene && currentScene.id === scene.id }"
                                            @click="loadScene(scene.id)"
                                            :title="`${scene.title}${scene.povCharacter ? ' (POV: ' + scene.povCharacter + ')' : ''}\n${scene.summary ? (scene.summaryStale ? 'Summary outdated' : 'Has summary') : 'No summary yet'}`"
                                            :aria-label="`${scene.title}: ${scene.summary ? (scene.summaryStale ? 'Summary outdated' : 'Has summary') : 'No summary yet'}`"
                                            style="display:flex;justify-content:space-between;align-items:center;">
                                            <div style="display:flex;align-items:center;gap:8px;">
                                                <span class="summary-dot"
                                                    :class="{ 'has': scene.summary && !scene.summaryStale, 'stale': scene.summaryStale, 'none': !scene.summary }"
                                                    :title="`${scene.title}: ${scene.summary ? (scene.summaryStale ? 'Summary outdated' : 'Has summary') : 'No summary yet'}`"
                                                    :aria-label="`${scene.title}: ${scene.summary ? (scene.summaryStale ? 'Summary outdated' : 'Has summary') : 'No summary yet'}`"></span>
                                                <div>
                                                    <div class="scene-title" x-text="scene.title"></div>
                                                    <div class="scene-meta" x-text="`${scene.wordCount || 0} words`">
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="item-actions" style="margin-left:12px;">
                                                <button class="menu-button" 
                                                    @click.stop="sceneActionsTarget = scene; showSceneActionsModal = true"
                                                    title="Scene actions">
                                                    ⋯
                                                </button>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>

                    <div x-show="currentProject && writingMode !== 'chat'" class="sidebar-actions"
                        style="display:flex;flex-direction:row;padding:10px;gap:8px;align-items:center;">
                        <button class="add-scene-btn" @click="openNewChapterModal()" aria-label="New chapter"
                            title="New Chapter">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                <path d="M3 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"
                                    fill="currentColor" />
                            </svg>
                        </button>

                        <button class="add-scene-btn" @click="openNewSceneModal()" aria-label="New scene"
                            title="New Scene">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                <path
                                    d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zM14 3.5L18.5 8H15a1 1 0 0 1-1-1V3.5z"
                                    fill="currentColor" />
                                <path d="M8 12h8v2H8v-2zm0 4h5v2H8v-2z" fill="currentColor" />
                            </svg>
                        </button>
                    </div>
                </div>
